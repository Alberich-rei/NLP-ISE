<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorola Cartoon Beeper</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'zpix';
            src: url('/static/zpix.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* 定义字体变量 */
        :root {
            --font-screen: 'zpix', 'VT323', monospace;
            --font-cartoon: 'Patrick Hand', cursive;
            --color-dark-brown: #4a332d;
            --color-accent-orange: #ffab40;
            --color-accent-yellow: #ffd740;
            --color-bg-cream: #fff8e1;
        }

        body {
            font-family: var(--font-cartoon);
            color: var(--color-dark-brown);
            background-color: var(--color-bg-cream);
        }

        /* 自定义滚动条 - 暖色调 */
        .custom-scrollbar::-webkit-scrollbar { width: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #ffe0b2; border-radius: 5px; border: 2px solid var(--color-dark-brown); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-accent-orange); border-radius: 5px; border: 2px solid var(--color-dark-brown); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--color-accent-yellow); }

        /* 卡通硬阴影类 */
        .cartoon-shadow { box-shadow: 6px 6px 0px 0px var(--color-dark-brown); }
        .cartoon-shadow-sm { box-shadow: 3px 3px 0px 0px var(--color-dark-brown); }
        .cartoon-shadow-hover:hover { box-shadow: 8px 8px 0px 0px var(--color-dark-brown); transform: translate(-2px, -2px); }
        .cartoon-shadow-active:active { box-shadow: 2px 2px 0px 0px var(--color-dark-brown); transform: translate(4px, 4px); }

        /* Notice 动态效果 */
        @keyframes notice-pulse {
            0%, 100% { 
                transform: rotate(-5deg) scale(1);
                background-color: #ffd740;
                box-shadow: 3px 3px 0px 0px var(--color-dark-brown);
            }
            25% { 
                transform: rotate(-3deg) scale(1.05);
                background-color: #ffab40;
            }
            50% { 
                transform: rotate(-7deg) scale(1.1);
                background-color: #ff8f00;
                box-shadow: 5px 5px 0px 0px var(--color-dark-brown);
            }
            75% { 
                transform: rotate(-4deg) scale(1.05);
                background-color: #ffab40;
            }
        }
        
        .notice-animated {
            animation: notice-pulse 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        
        .notice-animated:hover {
            animation-duration: 0.5s;
            transform: rotate(-2deg) scale(1.15) !important;
        }

        /* 屏幕字体特殊处理 */
        .screen-text { 
            font-family: var(--font-screen) !important; 
            font-size: 1.2rem; 
            font-weight: normal !important;
        }
    </style>
</head>
<body class="overflow-hidden h-screen selection:bg-orange-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        

        // 对接FastAPI后端接口
        const chatAPI = async (question) => {
            try {
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                const data = await resp.json();
                return data.answer || "[SYSTEM] No answer returned.";
            } catch (e) {
                return "[SYSTEM] Connection error.";
            }
        };

        const App = () => {
            const [input, setInput] = useState("");
            const [messages, setMessages] = useState([]);
            const [cards, setCards] = useState([]);
            const [isTyping, setIsTyping] = useState(false);
            const screenRef = useRef(null);
            const [draggingId, setDraggingId] = useState(null);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [uploading, setUploading] = useState(false);
            const [uploadMsg, setUploadMsg] = useState("");
        // 上传文件到 /api/upload
        const handleUpload = async (e) => {
            e.preventDefault();
            const file = e.target.elements.file.files[0];
            if (!file) return;
            setUploading(true);
            setUploadMsg("");
            const formData = new FormData();
            formData.append("file", file);
            try {
                const resp = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await resp.json();
                setUploadMsg(data?.msg || "Upload success!");
            } catch (err) {
                setUploadMsg("[SYSTEM] Upload failed.");
            }
            setUploading(false);
            e.target.reset();
        };

        // 清空历史 /api/clear_history
        const handleClearHistory = async () => {
            setMessages([]);
            setCards([]);
            try {
                await fetch("/api/clear_history", { method: "POST" });
            } catch (err) {
                // ignore
            }
        };

            useEffect(() => {
                if (screenRef.current) screenRef.current.scrollTop = screenRef.current.scrollHeight;
            }, [messages]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            // 打字机效果 (速度稍快一点，更活泼)
            const typeOutMessage = async (text, sender = 'BOT') => {
                setIsTyping(true);
                let displayedText = "";
                const messageId = Date.now();
                setMessages(prev => [...prev, { id: messageId, text: "", sender }]);

                for (let i = 0; i < text.length; i++) {
                    displayedText += text[i];
                    setMessages(prev => prev.map(msg => msg.id === messageId ? { ...msg, text: displayedText } : msg));
                    // 稍微加快一点速度
                    await new Promise(r => setTimeout(r, Math.random() * 20 + 10));
                }
                setIsTyping(false);
                return displayedText;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input.trim() || isTyping) return;
                const userText = input;
                setInput("");
                setMessages(prev => [...prev, { id: Date.now(), text: `> ${userText}`, sender: 'USER' }]);

                try {
                    setMessages(prev => [...prev, { id: 'loading', text: "THINKING...", sender: 'SYSTEM' }]);
                    const result = await chatAPI(userText); 
                    setMessages(prev => prev.filter(m => m.id !== 'loading'));
                    const finalText = await typeOutMessage(result, 'BOT');
                    createCard(finalText);
                } catch (error) {
                    setMessages(prev => [...prev, { id: Date.now(), text: "OOPS: CONNECTION LOST", sender: 'SYSTEM' }]);
                }
            };

            const createCard = (content) => {
                const id = Date.now();
                // 让卡片稍微分散一点
                const randomX = Math.floor(Math.random() * (window.innerWidth - 400)) + 50;
                const randomY = Math.floor(Math.random() * (window.innerHeight - 400)) + 50;
                // 随机旋转角度，增加趣味性
                const rotate = Math.floor(Math.random() * 6) - 3; 
                setCards(prev => [...prev, { id, content, x: randomX, y: randomY, rotate }]);
            };

            // 拖拽逻辑 (保持不变)
            const handleMouseDown = (e, id) => {
                const card = cards.find(c => c.id === id);
                setDraggingId(id);
                setOffset({ x: e.clientX - card.x, y: e.clientY - card.y });
                // 拖拽时把卡片提到最上层
                setCards(prev => [...prev.filter(c => c.id !== id), card]);
            };

            const handleMouseMove = (e) => {
                if (draggingId) {
                    setCards(prev => prev.map(card => {
                        if (card.id === draggingId) {
                            return { ...card, x: e.clientX - offset.x, y: e.clientY - offset.y };
                        }
                        return card;
                    }));
                }
            };

            return (
                <div className="min-h-screen relative" onMouseMove={handleMouseMove} onMouseUp={() => setDraggingId(null)}>
                    {/* 卡通背景图案 (暖色波点) */}
                    <div className="absolute inset-0 opacity-20 pointer-events-none bg-[radial-gradient(#ffab40_3px,transparent_3px)] bg-[size:20px_20px]"></div>
                    
                    {/* 标题 */}
                    <div className="absolute top-6 left-6 z-10">
                        <h1 className="text-5xl font-bold tracking-wide text-orange-600 drop-shadow-[2px_2px_0px_#4a332d]">
                            GENIUSO <span className="text-2xl bg-yellow-400 border-2 border-orange-800 px-2 rounded-lg inline-block notice-animated cursor-pointer">NOTICE!</span>
                        </h1>
                        <p className="text-lg font-bold text-orange-800 opacity-80 mt-1">Turbo Search v.2.0</p>
                    </div>

                    {/* 中央打字机区域 */}

                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] z-50">
                        {/* 机器外壳 */}
                        <div className="bg-orange-300 border-[6px] border-orange-900 rounded-[3rem] p-8 relative cartoon-shadow">
                            {/* 顶部装饰螺丝 */}
                            <div className="absolute top-4 left-4 w-4 h-4 bg-yellow-500 rounded-full border-2 border-orange-900"></div>
                            <div className="absolute top-4 right-4 w-4 h-4 bg-yellow-500 rounded-full border-2 border-orange-900"></div>
                            <div className="flex justify-between text-sm font-bold mb-3 text-orange-900 px-2">
                                <span>📶 SIGNAL: SUPER!</span>
                                <span>🔋 BAT: 100%</span>
                            </div>
                            {/* 显示屏区域 */}
                            <div className="bg-[#fff3e0] border-4 border-orange-800 rounded-3xl p-5 h-72 overflow-y-auto mb-6 custom-scrollbar screen-text cartoon-shadow-sm relative" ref={screenRef}>
                                {/* 屏幕反光效果 */}
                                <div className="absolute top-2 left-2 right-2 h-4 bg-white opacity-30 rounded-full pointer-events-none"></div>
                                {messages.map((msg, idx) => (
                                    <div key={msg.id} className={`mb-3 screen-text ${msg.sender === 'USER' ? 'text-orange-700' : 'text-orange-950'}`}>
                                        {msg.sender === 'BOT'
                                            ? <span
                                                className="screen-text"
                                                dangerouslySetInnerHTML={{ __html: marked.parse(msg.text) }}
                                              />
                                            : msg.text
                                        }
                                        {isTyping && idx === messages.length - 1 && <span className="animate-bounce inline-block w-3 h-5 bg-orange-600 ml-1 align-middle rounded-sm"></span>}
                                    </div>
                                ))}
                            </div>
                            {/* 输入区和按钮区（按钮在输入框下方） */}
                            <div className="bg-orange-400 p-3 rounded-2xl border-4 border-orange-800 cartoon-shadow-sm">
                                <div className="flex items-center gap-3">
                                    <span className="text-3xl font-bold text-orange-900 pl-2 screen-text">{">"}</span>
                                    <form onSubmit={handleSubmit} className="flex-1 flex items-center">
                                        <input
                                            type="text"
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            className="flex-1 bg-orange-100 border-b-4 border-orange-800 outline-none text-2xl p-2 rounded-lg placeholder-orange-400 font-bold transition-all focus:bg-white screen-text"
                                            placeholder="Type something fun..."
                                            disabled={isTyping}
                                            autoFocus
                                        />
                                        <button type="submit" 
                                            className={`bg-yellow-400 text-orange-950 text-xl px-6 py-3 font-bold rounded-xl border-4 border-orange-800 transition-all flex items-center justify-center ml-2
                                            ${isTyping ? 'opacity-50 cursor-not-allowed' : 'cartoon-shadow-hover cartoon-shadow-active'}`}
                                            disabled={isTyping}>
                                            <i data-lucide="send" className="w-6 h-6 stroke-[3px]"></i>
                                        </button>
                                    </form>
                                </div>
                                <div className="flex gap-3 mt-4 justify-end">
                                    {/* 上传按钮（单独form） */}
                                    <form onSubmit={handleUpload} className="relative">
                                        <label className="bg-yellow-400 text-orange-950 text-xl px-4 py-2 font-bold rounded-xl border-4 border-orange-800 cartoon-shadow-hover cartoon-shadow-active cursor-pointer flex items-center gap-1 screen-text">
                                            <i data-lucide="upload" className="w-5 h-5"></i>
                                            <input type="file" name="file" className="hidden" accept=".txt,.pdf,.doc,.docx" disabled={uploading} onChange={e => e.target.form && e.target.form.dispatchEvent(new Event('submit', { cancelable: true }))} />
                                            Upload
                                        </label>
                                        {uploadMsg && <span className="absolute left-0 top-full mt-1 text-orange-700 text-sm font-bold screen-text">{uploadMsg}</span>}
                                    </form>
                                    {/* 清空历史按钮 */}
                                    <button type="button"
                                        className="bg-orange-200 text-orange-900 text-xl px-4 py-2 font-bold rounded-xl border-4 border-orange-800 cartoon-shadow-hover cartoon-shadow-active screen-text"
                                        onClick={handleClearHistory}
                                    >
                                        <i data-lucide="eraser" className="w-5 h-5 mr-1"></i>Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 拖拽卡片层 */}
                    {cards.map((card) => (
                        <div
                            key={card.id}
                            className="absolute w-72 bg-[#fffbf0] text-orange-950 p-4 cursor-grab active:cursor-grabbing transition-transform border-[5px] border-orange-900 rounded-2xl cartoon-shadow"
                            style={{ 
                                left: card.x, 
                                top: card.y,
                                transform: `rotate(${card.rotate}deg) scale(${draggingId === card.id ? 1.05 : 1})`,
                                zIndex: draggingId === card.id ? 100 : 1
                            }}
                            onMouseDown={(e) => handleMouseDown(e, card.id)}
                        >
                             {/* 卡片顶部的胶带效果 */}
                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6 bg-yellow-200/80 border-2 border-yellow-600/50 rotate-2"></div>

                            <div className="border-b-4 border-orange-200 pb-2 mb-3 flex justify-between text-sm font-bold text-orange-700 uppercase">
                                <span>📄 TICKET #{card.id.toString().slice(-4)}</span>
                                <i data-lucide="grab" className="w-5 h-5 opacity-50"></i>
                            </div>
                            <div className="text-xl leading-snug font-bold whitespace-pre-wrap screen-text"
                                dangerouslySetInnerHTML={{ __html: marked.parse(card.content) }}>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
